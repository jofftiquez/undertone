name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pinned: the tests run on this engine. Bump it with the engine version you test against locally.
      - run: npm install -g @anthropic-ai/claude-code@2.1.317
      - run: claude plugin validate .
      - run: claude plugin test .
      # ponytail: no tsc here; the engine types in .claude-plugin/types are generated on a
      # logged-in load, so the type check stays local (see README → Develop).
